# Группы хостов
[master]
master ansible_host=192.168.0.26

[workers]
worker1 ansible_host=192.168.0.18
worker2 ansible_host=192.168.0.19

# Общая группа для всех узлов K8s (чтобы плейбук выполнялся на всех)
