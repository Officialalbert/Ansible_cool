master
workers

# --- Переменные для группы master ---
[master:vars]
ansible_user=alb
ansible_password=admin123
ansible_become_password=admin123

# --- Переменные для группы workers ---
[workers:vars]
ansible_user=admin
ansible_password=admin
ansible_become_password=admin
